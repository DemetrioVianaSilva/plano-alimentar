<title>Meu Plano Alimentar</title>

<style>
:root{--bg:#f3f6f1;--surface:#fff;--ink:#17251c;--muted:#5d6f62;--line:#dde5dc;--leaf:#1f6b45;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f1712;--surface:#17221b;--ink:#e7efe8;--muted:#97a99c;--line:#26362b;--leaf:#5cc48b;--err:#f2b8b5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Figtree","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{font:800 26px/1.1 "Bricolage Grotesque","Segoe UI",sans-serif;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
input[type=text],input[type=password]{font:500 16px inherit;font-family:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.rem{flex-direction:row;align-items:center;font-weight:500}
.rem input{width:18px;height:18px;accent-color:var(--leaf)}
button{font:600 15px inherit;font-family:inherit;padding:12px;border:0;border-radius:10px;background:var(--leaf);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Meu Plano Alimentar</h1>
  <p>Acesso restrito. Entre com seu usuário e senha.</p>
  <label>Usuário<input type="text" id="u" name="username" autocomplete="username" inputmode="numeric" required></label>
  <label>Senha<input type="password" id="p" name="password" autocomplete="current-password" required></label>
  <label class="rem"><input type="checkbox" id="r" checked> Manter conectado neste aparelho</label>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form>

const K="pa:auth";
const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function open(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(P.i)},key,d64(P.d));
  let html=new TextDecoder().decode(pt);
  const out=`<button id="__sair" style="position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:50;font:600 12px system-ui;padding:6px 10px;border-radius:8px;border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit;cursor:pointer;opacity:.7">Sair</button>
<script>document.getElementById("__sair").onclick=function(){try{localStorage.removeItem("${K}")}catch(e){}location.reload()}<\/script></body>`;
  html=html.replace("</body>",out);
  document.open();document.write(html);document.close();
}
(async()=>{try{const s=localStorage.getItem(K);if(s)await open(d64(s))}catch(e){try{localStorage.removeItem(K)}catch(_){}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),er=document.getElementById("e");
  b.disabled=true;b.textContent="Verificando…";er.textContent="";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("u").value.trim()+":"+document.getElementById("p").value),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(P.s),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    const raw=await crypto.subtle.exportKey("raw",k);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(P.i)},k,d64(P.d));
    if(document.getElementById("r").checked){try{localStorage.setItem(K,e64(raw))}catch(e){}}
    await open(raw);
  }catch(e){er.textContent="Usuário ou senha incorretos.";b.disabled=false;b.textContent="Entrar"}
});
</script>
